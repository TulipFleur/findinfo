[package]
name = "onepass"
version = "0.1.0"
edition = "2021"
description = "Passive subdomain collector for AI agents"

[[bin]]
name = "onepass"
path = "src/main.rs"

[dependencies]
serde_json = "1"
ureq = { version = "=2.9.7", default-features = false, features = ["tls"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
